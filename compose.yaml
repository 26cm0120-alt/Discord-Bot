services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.26.2
    restart: unless-stopped
    expose:
      - "50021"

  bot:
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      VOICEVOX_URL: http://voicevox:50021
      BOT_SETTINGS_PATH: /data/.bot-settings.json
    volumes:
      - ./data:/data
    depends_on:
      - voicevox
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(process.env.VOICEVOX_URL + '/version', {signal: AbortSignal.timeout(4000)}).then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

